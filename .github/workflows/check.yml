name: check
# O app decide sozinho se busca ou não, pela cota que resta na SerpApi; aqui só chamamos ele de hora em hora.
on:
  schedule: [{ cron: '7 * * * *' }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://passagens-phi.vercel.app/api/cron
